global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The proxy runs on the host via run_local_litellm_proxy.sh (default :4000) and exposes
  # /metrics through litellm's built-in prometheus callback. Prometheus runs
  # inside Docker, so it reaches the host proxy via host.docker.internal.
  # If you run the proxy on another machine, point this target at it.
  - job_name: litellm-proxy
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:4000"
        labels:
          proxy: "free-generalist"
